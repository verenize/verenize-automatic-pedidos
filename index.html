<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos Verenize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
margin:0;
padding:0;
}
body{
background:#f4f4f2;
padding-bottom:90px;
}
.header{
background:linear-gradient(160deg,#f3c8ab 0%,#efb890 55%,#e9a875 100%);
padding:20px 18px 22px;
color:#5a331a;
}
.header-top{
display:flex;
justify-content:center;
margin-bottom:14px;
}
.logo{
width:220px;
max-width:60%;
height:auto;
filter:brightness(0) invert(1);
}
.header-fields{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:14px;
}
.header-fields input{
flex:1;
min-width:140px;
padding:10px 12px;
border:none;
border-radius:9px;
font-size:14px;
}
.total-card{
background:rgba(255,255,255,0.94);
border-radius:14px;
padding:12px 16px;
}
.total-card .label{
font-size:11px;
font-weight:700;
letter-spacing:0.5px;
opacity:0.7;
text-transform:uppercase;
}
.total-card .amount{
font-size:26px;
font-weight:800;
line-height:1.2;
}
.total-card .reembolso{
font-size:12.5px;
font-weight:600;
margin-top:2px;
opacity:0.85;
}
.search-wrap{
padding:16px 16px 6px;
}
.buscador{
width:100%;
padding:12px 14px;
border:1px solid #e4e2dd;
border-radius:10px;
font-size:15px;
background:#fff;
}
.chips{
display:flex;
gap:8px;
overflow-x:auto;
padding:12px 16px 4px;
}
.chip{
flex-shrink:0;
padding:8px 15px;
border-radius:20px;
font-size:12.5px;
font-weight:600;
cursor:pointer;
border:1px solid #eee;
background:#fff;
color:#777;
white-space:nowrap;
}
.chip.active{
background:#e9a875;
color:#fff;
border-color:#e9a875;
}
.section-title{
padding:16px 16px 8px;
font-size:15px;
font-weight:700;
color:#3a2416;
}
.promo-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:12px;
padding:0 16px 8px;
}
.promo-card{
background:linear-gradient(160deg,#f8e2cd,#f0bf94);
border-radius:14px;
padding:14px;
position:relative;
transition:box-shadow .15s;
display: flex;
flex-direction: column;
}
.promo-card.active{
box-shadow:0 0 0 2px #c1672b inset;
}
.promo-card .p-title{
font-size:14px;
font-weight:800;
color:#5a331a;
margin-top:4px;
}
.promo-card .p-desc{
font-size:11.5px;
color:#7a5236;
margin-top:6px;
line-height:1.5;
flex-grow: 1;
}
.promo-card .p-price{
font-size:18px;
font-weight:800;
color:#5a331a;
margin-top:10px;
}
.promo-card .p-controls{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:10px;
}
.promo-card input[type="number"]{
width:60px;
padding:7px;
border:none;
border-radius:8px;
text-align:center;
font-size:13px;
font-weight:700;
}
.promo-card .p-importe{
font-size:13px;
font-weight:700;
color:#5a331a;
}
.product-list{
padding:0 16px 8px;
display:flex;
flex-direction:column;
gap:10px;
}
.product-card{
display:flex;
gap:12px;
background:#fff;
border:1px solid #eee;
border-radius:14px;
padding:12px;
align-items:center;
transition:background .15s,border-color .15s;
}
.product-card.active{
background:#fff8f2;
border-color:#e9a875;
}
.product-img{
width:60px;
height:60px;
border-radius:10px;
object-fit:contain;
background:#f6f6f4;
flex-shrink:0;
}
.product-info{
flex:1;
min-width:0;
}
.product-name{
font-size:13.5px;
font-weight:600;
color:#2b2b2b;
line-height:1.35;
}
.product-prices{
font-size:11.5px;
color:#999;
margin-top:3px;
}
.product-tag{
display:inline-block;
margin-top:5px;
font-size:9.5px;
font-weight:700;
padding:3px 8px;
border-radius:6px;
}
.tag-dist{background:#e3f3e8;color:#2e7d4f;}
.tag-sub{background:#fdeee0;color:#c1672b;}
.qty-group{
display:flex;
gap:8px;
}
.qty-box{
display:flex;
flex-direction:column;
align-items:center;
gap:3px;
}
.qty-box input{
width:48px;
height:32px;
border:1px solid #ddd;
border-radius:8px;
text-align:center;
font-size:13px;
font-weight:600;
}
.qty-label{
font-size:8.5px;
color:#aaa;
font-weight:600;
}
.importe-tag{
font-size:12px;
font-weight:700;
color:#5a331a;
text-align:right;
margin-top:8px;
}
.resumen{
margin:16px;
padding:14px 16px;
border:1px solid #eee;
border-radius:12px;
background:#fff;
}
.resumen h3{
font-size:14px;
font-weight:700;
margin-bottom:8px;
color:#3a2416;
}
.resumen .item{
font-size:12.5px;
color:#555;
margin-bottom:8px;
line-height:1.5;
padding-bottom:8px;
border-bottom:1px solid #f2f2f2;
}
.resumen .item:last-child{border-bottom:none;}
.resumen .vacio{
font-size:13px;
color:#999;
}
.sticky-bar{
position:fixed;
bottom:0;
left:0;
right:0;
background:#fff;
border-top:1px solid #eee;
padding:12px 16px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
z-index:50;
}
.sticky-total{
font-size:12px;
color:#777;
}
.sticky-total b{
font-size:18px;
color:#2b2b2b;
display:block;
}
.sticky-actions{
display:flex;
gap:8px;
}
.btn{
border:0;
padding:12px 16px;
border-radius:10px;
font-size:13px;
font-weight:700;
cursor:pointer;
}
.btn-enviar{
background:#25D366;
color:#fff;
}
.btn-limpiar{
background:#f1f1ef;
color:#777;
}
@media(min-width:700px){
.product-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
}
}
</style>
</head>
<body>

<div class="header">
<div class="header-top">
<img class="logo" src="LOGO+SLOGAN(NEGRO) (5).png" alt="Verenize">
</div>
<div class="header-fields">
<input id="socio" placeholder="Socio comercial">
<input id="fecha" type="date">
</div>
<div class="total-card">
<div class="label">Total acumulado</div>
<div class="amount">$<span id="totalArriba">0.00</span></div>
<div class="reembolso">Total reembolso: $<span id="reembolsoArriba">0.00</span></div>
<div class="promo-note">Nota: Pedidos con promociones no entran en reembolso ni se aplica crédito.</div>
</div>
</div>

<div class="search-wrap">
<input type="text" id="buscador" class="buscador" placeholder="Buscar producto..." oninput="render()">
</div>

<div class="chips" id="chips"></div>

<div id="promosSection">
<div class="section-title">Promociones de aniversario · vigencia hasta el 21 de agosto</div>
<div class="promo-grid" id="promoGrid"></div>
</div>

<div id="productosSection">
<div class="section-title">Productos</div>
<div class="product-list" id="productGrid"></div>
</div>

<div class="resumen">
<h3>Resumen del pedido</h3>
<div id="resumenPedido"><div class="vacio">No hay productos seleccionados.</div></div>
</div>

<div class="sticky-bar">
<div class="sticky-total">Total<br><b>$<span id="total">0.00</span></b></div>
<div class="sticky-actions">
<button class="btn btn-limpiar" onclick="limpiar()">Limpiar</button>
<button class="btn btn-enviar" onclick="enviarWhatsapp()">Enviar pedido</button>
</div>
</div>

<script>
const whatsapp = "526624212850";
const metaReembolso = 104400;

const categorias = ["Todos","Promos","Línea Profesional","Vereplex pro","Línea de Mantenimiento","Hi-Style","Herramientas"];
let categoriaActual = "Todos";

const productos = [
["Kit de Keratina Brasileña 1000 ml",2000,2800,16,true,"Kit_proteina_1000ml VP12.png","Línea Profesional"],
["Kit de Keratina Brasileña 300 ml",800,1200,24,true,"Kit_proteina_300ml.png","Línea Profesional"],
["Kit de Keratina Brasileña 100 ml",350,350,96,false,"Kit_proteina_100ml.png","Línea Profesional"],
["Tratamiento de Keratina VP12 1000 ml",1800,2500,16,true,"Trat_Proteina_1000ml.png","Línea Profesional"],
["Shampoo Purificante 1000 ml",350,416,16,true,"Shampoo_Purificante_1000ml.png","Línea Profesional"],
["Kit Vereplex 500 ml",800,1200,24,true,"kit-vereplex-500.png","Vereplex pro"],
["Vereplex Pro No. 1 500 ml",700,1100,24,true,"Vereplex_No1_500ml.png","Vereplex pro"],
["Vereplex Pro No. 2 500 ml",250,350,24,true,"Vereplex_No2_500ml.png","Vereplex pro"],
["Kit Vereplex PRO Sachet 30 ml",70,90,1,false,"kit-vereplex-sachet-30.png","Vereplex pro"],
["Kit de Mantenimiento 1000 ml",450,616,16,true,"Kit_matenimiento_1000ml.png","Línea de Mantenimiento"],
["Kit de Mantenimiento 500 ml",290,360,36,true,"Kit_mantenimiento_500ml.png","Línea de Mantenimiento"],
["Kit de Mantenimiento 100 ml",120,120,96,false,"Kit_mantenimiento_100ml.png","Línea de Mantenimiento"],
["Shampoo de Mantenimiento 1000 ml",280,360,16,true,"Shampoo_Mant_1000ml.png","Línea de Mantenimiento"],
["Acondicionador de Mantenimiento 1000 ml",280,360,16,true,"Acondicionador_Mant_1000ml.png","Línea de Mantenimiento"],
["Shampoo de Mantenimiento 500 ml",160,200,36,true,"Shampoo_mant_500ml.png","Línea de Mantenimiento"],
["Acondicionador de Mantenimiento 500 ml",160,200,36,true,"Acondicionador_Mant_500ml.png","Línea de Mantenimiento"],
["Tratamiento Sérum de Argán 100 ml",200,280,48,true,"Trat_SerumArgan_100ml.png","Línea de Mantenimiento"],
["Tratamiento Sérum de Argán 50 ml",120,120,63,false,"Trat_SerumArgan_50ml.png","Línea de Mantenimiento"],
["Mascarilla Mágica Nutritiva 500 ml",210,294,24,true,"Mascarilla_Magica_500ml.png","Línea de Mantenimiento"],
["Mascarilla Mágica Nutritiva 100 ml",85,85,96,false,"Mascarilla_Magica_100ml.png","Línea de Mantenimiento"],
["Tratamiento Leave In 300 ml",150,200,48,true,"Trat_LeaveIn_300ml.png","Línea de Mantenimiento"],
["Tratamiento Leave In 100 ml",85,85,96,false,"Trat_LeaveIn_100ml.png","Línea de Mantenimiento"],
["Caja Shot de Reparación Instantánea",360,460,36,true,"Caja_Ampolletas.png","Línea de Mantenimiento"],
["Shot de Reparación Instantánea 12 ml",80,80,48,false,"Shot_Reparacion_12ml.png","Línea de Mantenimiento"],
["Set de Viaje para Cuidado del Cabello",480,580,10,true,"Set_de_viaje.png","Línea de Mantenimiento"],
["Crema Hidratante para Rizos 300 ml",130,190,48,true,"Crema_Hidratante_Rizos_300ml.png","Hi-Style"],
["Gel Hidratante para Rizos 300 ml",145,200,48,true,"ButterGel_Hidratante_Rizos_300ml.png","Hi-Style"],
["Secadora V-Lux Negra",2500,3150,10,true,"Secadora_V-Lux_Negra.png","Herramientas"],
["Secadora V-Lux Blanca",2500,3150,10,true,"Secadora_V-Lux_Blanca.png","Herramientas"],
["Plancha de Titanio",1200,1575,15,true,"Plancha_Titanio.png","Herramientas"],
["Peine de Carbón",25,42,50,true,"Peine_Carbon.png","Herramientas"],
["Cepillo Cuadrado",100,140,12,true,"Cepillo_Cuadrado.png","Herramientas"],
["Cepillo Redondo",160,200,10,true,"Cepillo_Redondo.png","Herramientas"],
["Brocha",25,42,50,true,"Brocha.png","Herramientas"],
["Kimono",250,350,20,true,"Kimono negro.png","Herramientas"]
];

const promos = [
["Kit de Keratina 300ml 4 pz", "Kit de keratina 300ml 4 pz por $2000", 2000],
["7+1 Kit de Mantenimiento","Compra 7 Kits de Mantenimiento 1000ml y llévate 1 Kit de Mantenimiento 1000ml",3150],
["Compra 48 y Recibe Producto Gratis","Compra 48 Mascarillas Mágicas Nutritivas 500ml + 48 Tratamientos Sérum de Argán 100ml + 48 Tratamientos Leave In 300ml. Llévate 12 Kits de Tratamiento de Proteína 100ml + 12 Kimonos",26880],
["Kit de Inicio 1","1 Tratamiento de Proteína VP8 300ml + 1 Shampoo Purificante 300ml + 1 Shampoo de Mantenimiento 500ml + 1 Acondicionador de Mantenimiento 500ml + 1 Mascarilla Mágica Nutritiva 500ml + 1 Tratamiento Leave In 300ml + 1 Tratamiento Sérum de Argán 100ml + 1 Plancha de Titanio + 1 Brocha + 1 Peine de Carbón",2500],
["Kit de Inicio 3","1 Tratamiento de Proteína 1000ml + 1 Shampoo Purificante 1000ml + 1 Shampoo de Mantenimiento 500ml + 1 Acondicionador de Mantenimiento 500ml + 1 Mascarilla Mágica Nutritiva 500ml + 1 Tratamiento Leave In 300ml + 1 Tratamiento Sérum de Argán 100ml + 1 Kit Vereplex PRO 500ml + 1 Plancha de Titanio + 1 Secadora V-Lux + 1 Brocha + 1 Peine de Carbón + 1 Kimono + 1 Cepillo Cuadrado + 1 Cepillo Redondo",6500],
["Kits Tratamiento de Proteína VP12","Compra 16 Kits de Tratamiento de Proteína VP12 1000ml y llévate 16 Kimonos",25600],
["Plancha de Titanio","Compra 15 Planchas de Titanio y llévate 5 Sets de Viaje (c/u incluye Kit de Mantenimiento 100ml + Sérum de Argán 50ml + Leave In 100ml + Mascarilla Mágica 100ml + Bolsa Cosmetiquera)",18000],
["Rizos","Compra 1 Caja de Crema Hidratante para Rizos + 1 Caja de Butter Gel Hidratante para Rizos y llévate 12 Cremas + 12 Butter Gels",13200],
["Secadora V-Lux","Compra 9 Secadoras V-Lux y llévate 1 Secadora V-Lux + 10 Cepillos Redondos",22500]
];

function cargarChips(){
const cont = document.getElementById("chips");
cont.innerHTML = "";
categorias.forEach(c=>{
const chip = document.createElement("div");
chip.className = "chip" + (c === categoriaActual ? " active" : "");
chip.innerText = c;
chip.onclick = () => { categoriaActual = c; render(); };
cont.appendChild(chip);
});
}

function render(){
cargarChips();
const filtro = document.getElementById("buscador").value.toLowerCase();

const mostrarPromos = categoriaActual === "Todos" || categoriaActual === "Promos";
document.getElementById("promosSection").style.display = mostrarPromos ? "block" : "none";

const promoGrid = document.getElementById("promoGrid");
promoGrid.innerHTML = "";
if(mostrarPromos){
promos.forEach((p,i)=>{
if(filtro && !p[0].toLowerCase().includes(filtro)) return;
const cant = window["promoCant"+i] || 0;
const card = document.createElement("div");
card.className = "promo-card" + (cant > 0 ? " active" : "");
card.innerHTML = `
<div class="p-title">${p[0]}</div>
<div class="p-desc">${p[1]}</div>
<div class="p-price">$${p[2].toLocaleString('es-MX')}</div>
<div class="p-controls">
<input type="number" min="0" value="${cant}" id="promoCantidad${i}" oninput="calcular()">
<div class="p-importe">$<span id="promoImporte${i}">0.00</span></div>
</div>`;
promoGrid.appendChild(card);
});
}

const mostrarProductos = categoriaActual !== "Promos";
document.getElementById("productosSection").style.display = mostrarProductos ? "block" : "none";

const grid = document.getElementById("productGrid");
grid.innerHTML = "";
if(mostrarProductos){
productos.forEach((p,i)=>{
if(categoriaActual !== "Todos" && categoriaActual !== "Promos" && p[6] !== categoriaActual) return;
if(filtro && !p[0].toLowerCase().includes(filtro)) return;
const cantPzas = window["cant"+i] || 0;
const cantCajas = window["caja"+i] || 0;
const card = document.createElement("div");
card.className = "product-card" + ((cantPzas > 0 || cantCajas > 0) ? " active" : "");
card.id = "card"+i;
card.innerHTML = `
<img class="product-img" src="${p[5]}" alt="${p[0]}">
<div class="product-info">
<div class="product-name">${p[0]}</div>
<div class="product-prices">Dist. $${p[1]} · Sub. $${p[2]}</div>
<span class="product-tag" id="tag${i}">-</span>
<div class="qty-group" style="margin-top:8px;">
<div class="qty-box">
<input type="number" min="0" value="${cantPzas}" id="cantidad${i}" oninput="calcular()">
<div class="qty-label">piezas</div>
</div>
<div class="qty-box">
<input type="number" min="0" value="${cantCajas}" id="cajasInput${i}" oninput="calcular()">
<div class="qty-label">cajas</div>
</div>
</div>
<div class="importe-tag">$<span id="importe${i}">0.00</span></div>
</div>`;
grid.appendChild(card);
});
}

calcular();
}

function calcular(){
let total = 0;
let resumenHTML = "";

productos.forEach((p,i)=>{
const cantEl = document.getElementById(`cantidad${i}`);
const cajaEl = document.getElementById(`cajasInput${i}`);
if(!cantEl || !cajaEl) return;

let cantPzas = Number(cantEl.value) || 0;
let cantCajas = Number(cajaEl.value) || 0;
window["cant"+i] = cantPzas;
window["caja"+i] = cantCajas;

let totalPiezas = cantPzas + (cantCajas * p[3]);
let importe = 0;
let precioAplicado = "";
let descuentoTexto = "";

if(totalPiezas >= p[3]){
importe = totalPiezas * p[1];
precioAplicado = "Distribuidor";
}else{
importe = totalPiezas * p[2];
precioAplicado = "Subdistribuidor";
if(p[4] && totalPiezas > 0){
importe = importe * 0.90;
descuentoTexto = " con 10% desc.";
}
}

document.getElementById(`importe${i}`).innerText = importe.toFixed(2);

const tag = document.getElementById(`tag${i}`);
const card = document.getElementById(`card${i}`);
if(totalPiezas > 0){
tag.className = "product-tag " + (precioAplicado === "Distribuidor" ? "tag-dist" : "tag-sub");
tag.innerText = precioAplicado + (descuentoTexto ? " · 10% desc." : "");
card.classList.add("active");
}else{
tag.className = "product-tag";
tag.innerText = "-";
card.classList.remove("active");
}

if(totalPiezas > 0){
resumenHTML += `
<div class="item" style="display: flex; justify-content: space-between; align-items: center;">
<div>
<strong>${p[0]}</strong><br>
Piezas: ${cantPzas} | Cajas: ${cantCajas} | Total piezas: ${totalPiezas}<br>
Precio aplicado: ${precioAplicado}${descuentoTexto} | Total: $${importe.toFixed(2)}
</div>
<button onclick="eliminarItem('prod', ${i})" style="background:#ff4d4d; color:#fff; border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; font-weight:bold; font-size:12px; margin-left:10px; flex-shrink:0;" title="Quitar">×</button>
</div>`;
}

total += importe;
});

promos.forEach((p,i)=>{
const cantEl = document.getElementById(`promoCantidad${i}`);
if(!cantEl) return;
let cant = Number(cantEl.value) || 0;
window["promoCant"+i] = cant;
let importe = cant * p[2];
const importeEl = document.getElementById(`promoImporte${i}`);
if(importeEl) importeEl.innerText = importe.toFixed(2);

if(cant > 0){
resumenHTML += `
<div class="item" style="display: flex; justify-content: space-between; align-items: center;">
<div>
<strong>PROMO: ${p[0]}</strong><br>
Cantidad: ${cant} | Precio: $${p[2].toLocaleString('es-MX')} | Total: $${importe.toFixed(2)}
</div>
<button onclick="eliminarItem('promo', ${i})" style="background:#ff4d4d; color:#fff; border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; font-weight:bold; font-size:12px; margin-left:10px; flex-shrink:0;" title="Quitar">×</button>
</div>`;
}
total += importe;
});

if(resumenHTML === ""){
resumenHTML = '<div class="vacio">No hay productos seleccionados.</div>';
}

let reembolso = total > metaReembolso ? total - metaReembolso : 0;

document.getElementById("total").innerText = total.toFixed(2);
document.getElementById("totalArriba").innerText = total.toFixed(2);
document.getElementById("reembolsoArriba").innerText = reembolso.toFixed(2);
document.getElementById("resumenPedido").innerHTML = resumenHTML;
}

function eliminarItem(tipo, index){
if(tipo === 'prod'){
window["cant"+index] = 0;
window["caja"+index] = 0;
let pInput = document.getElementById(`cantidad${index}`);
let cInput = document.getElementById(`cajasInput${index}`);
if(pInput) pInput.value = 0;
if(cInput) cInput.value = 0;
} else if(tipo === 'promo'){
window["promoCant"+index] = 0;
let pInput = document.getElementById(`promoCantidad${index}`);
if(pInput) pInput.value = 0;
}
calcular();
}

function enviarWhatsapp(){
let socio = document.getElementById("socio").value;
let fecha = document.getElementById("fecha").value;
let total = document.getElementById("total").innerText;
let reembolso = document.getElementById("reembolsoArriba").innerText;

let mensaje = `*Hola, quiero realizar este pedido Verenize:*%0A%0A`;
mensaje += `*Socio comercial:* ${socio}%0A`;
mensaje += `*Fecha de pedido:* ${fecha}%0A%0A`;

productos.forEach((p,i)=>{
let cantPzas = window["cant"+i] || 0;
let cantCajas = window["caja"+i] || 0;
let totalPiezas = cantPzas + (cantCajas * p[3]);

if(totalPiezas > 0){
let importe = totalPiezas >= p[3] ? totalPiezas * p[1] : totalPiezas * p[2] * (p[4] ? 0.9 : 1);
mensaje += `*Producto:* ${p[0]}%0A`;
mensaje += `*Piezas capturadas:* ${cantPzas}%0A`;
mensaje += `*Cajas capturadas:* ${cantCajas}%0A`;
mensaje += `*Total piezas:* ${totalPiezas}%0A`;
mensaje += `*Importe:* $${importe.toFixed(2)}%0A%0A`;
}
});

promos.forEach((p,i)=>{
let cant = window["promoCant"+i] || 0;
if(cant > 0){
let importe = cant * p[2];
mensaje += `*PROMO:* ${p[0]}%0A`;
mensaje += `*Cantidad:* ${cant}%0A`;
mensaje += `*Importe:* $${importe.toFixed(2)}%0A%0A`;
}
});

mensaje += `*TOTAL ACUMULADO:* $${total}%0A`;
mensaje += `*TOTAL REEMBOLSO:* ${reembolso}%0A%0A`;
mensaje += `*Nota: Pedidos con promociones no entran en reembolso ni se aplica crédito.*`;

window.open(`https://wa.me/${whatsapp}?text=${mensaje}`,"_blank");
}

function limpiar(){
if(!confirm("¿Seguro que quieres limpiar todo el pedido? Esta acción no se puede deshacer.")) return;
productos.forEach((p,i)=>{
window["cant"+i] = 0;
window["caja"+i] = 0;
});
promos.forEach((p,i)=>{
window["promoCant"+i] = 0;
});
document.getElementById("buscador").value = "";
categoriaActual = "Todos";
render();
}

document.getElementById("fecha").valueAsDate = new Date();
render();
</script>
